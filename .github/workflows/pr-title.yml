name: PR title

# PRs are squash-merged with the PR title as the commit subject, so the title is what lands on
# master and what release-please reads. The "Conventional commits" ruleset rejects a bad subject
# at merge time; this check reports it on the PR as soon as it is opened or retitled. Its own
# workflow so that editing a title does not re-run CI.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Same pattern as the "Conventional commits" ruleset on master.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9./_-]+\))?!?: [^[:space:]]'
          if ! printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title is not a Conventional Commit: <type>(<scope>)!: <description>"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check plugin release coupling
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: scripts/check-plugin-release-coupling.sh "$BASE_SHA" HEAD "$TITLE" "$AUTHOR" "$HEAD_BRANCH"
