# Development tools for local-decider. `mise trust && mise install && mise run setup`.
# CI installs the same pins through jdx/mise-action, so local and CI runs use the same bits.

[settings]
lockfile = true
http_retries = 3
pin = true

[tools]
node = "26.13.0"
pnpm = "12.16.1"
bats = "1.14.0"
# Manages the Python engines' environments (strands-decider) under ~/.local/share/local-decider.
uv = "0.13.7"
# Workflow and dependabot.yml lint (`lint:actions`).
jactionlint = "2.4.0"
shellcheck = "0.11.0"
# Markdown lint (`md-check`, .rumdl.toml).
rumdl = "0.3.2"
# Dead code, duplication and complexity (`lint:fallow`, fallow.toml).
"github:fallow-rs/fallow" = "3.39.0"
# Cognitive/cyclomatic complexity ceilings for the TypeScript sources (`lint:complexity`).
"github:moznion/cccc" = "1.8.6"
# Workflow security audit (`lint:zizmor`).
zizmor = "1.31.1"
# Agent tooling: the fff and ripwire MCP servers in .mcp.json.
"github:dmtrKovalenko/fff.nvim" = { version = "0.11.0", bin = "fff-mcp", platforms = { linux-x64 = { asset_pattern = "fff-mcp-x86_64-unknown-linux-musl" }, linux-arm64 = { asset_pattern = "fff-mcp-aarch64-unknown-linux-musl" }, macos-x64 = { asset_pattern = "fff-mcp-x86_64-apple-darwin" }, macos-arm64 = { asset_pattern = "fff-mcp-aarch64-apple-darwin" } } }
"github:redhat-et/ripwire" = { version = "0.6.8", bin = "ripwire", platforms = { linux-x64 = { asset_pattern = "ripwire-*-linux-x64.tar.gz" }, linux-arm64 = { asset_pattern = "ripwire-*-linux-arm64.tar.gz" }, macos-arm64 = { asset_pattern = "ripwire-*-macos-arm64.tar.gz" } } }

[tasks.setup]
description = "Install workspace dependencies (frozen lockfile)"
run = "pnpm install --frozen-lockfile"

[tasks.build]
description = "Build every package (topological order)"
run = "pnpm -r build"

[tasks.test]
description = "Unit tests for every package"
run = "pnpm -r test"

[tasks.typecheck]
description = "tsc --noEmit for every package"
run = "pnpm -r typecheck"

[tasks.lint]
description = "oxlint (type-aware) and oxfmt --check"
run = "pnpm run lint"

[tasks.fmt]
description = "Format sources with oxfmt and Markdown with rumdl"
run = ["pnpm run fmt", "rumdl fmt ."]

[tasks.md-check]
description = "Lint Markdown files (.rumdl.toml)"
run = "rumdl check ."

[tasks."lint:actions"]
description = "jactionlint (with shellcheck on run: scripts) on the workflows and dependabot.yml"
run = "jactionlint"

[tasks."lint:pins"]
description = "Every workflow `uses:` pinned to a full commit SHA"
run = "scripts/check-action-pins.sh .github/workflows/*.yml"

[tasks."lint:zizmor"]
description = "zizmor: workflow security audit"
run = "zizmor --offline .github/workflows"

[tasks."lint:shell"]
description = "shellcheck the repository's shell scripts"
run = "shellcheck -S info scripts/*.sh plugins/local-decider/hooks/*.sh plugins/local-decider/tests/*.bats"

[tasks."test:shim"]
description = "The plugin's hook shim finds node on a bare PATH and fails open without it"
run = '''
#!/usr/bin/env bash
set -euo pipefail
bats_bin=$(mise which bats)
bats_root=$(cd -- "$(dirname "$bats_bin")/.." && pwd)
PATH="$bats_root/libexec/bats-core:/bin:/usr/bin:$PATH" /bin/bash "$bats_bin" plugins/local-decider/tests
'''

[tasks."lint:complexity"]
# Paths spelled out: mise runs tasks with sh, and dash (Ubuntu CI) has no brace expansion.
description = "cccc: cognitive and cyclomatic complexity ceilings (cccc.toml)"
run = "s=0; cccc --top-cognitive 10 packages/*/src packages/paseo-plugin/server packages/paseo-plugin/shared packages/paseo-plugin/client || s=$?; cccc --top-cyclomatic 10 packages/*/src packages/paseo-plugin/server packages/paseo-plugin/shared packages/paseo-plugin/client || s=$?; exit $s"

[tasks."lint:uvlock"]
description = "uv.lock is current for the strands-decider engine project"
run = "uv lock --check --project packages/gateway/engines/strands-decider"

[tasks."lint:fallow"]
description = "fallow: dead code, duplication and complexity (fallow.toml)"
run = "fallow"

[tasks.check]
description = "Everything CI checks"
depends = [
  "lint",
  "typecheck",
  "md-check",
  "lint:actions",
  "lint:pins",
  "lint:zizmor",
  "lint:shell",
  "test:shim",
  "test:scripts",
  "lint:complexity",
  "lint:fallow",
  "lint:uvlock",
]
run = ["pnpm -r build", "pnpm -r test"]

[tasks."test:integration"]
description = "Gateway integration tests against a real engine; LOCAL_DECIDER_IT_ENGINE_URL=http://127.0.0.1:PORT of a running `strands-decider serve`"
dir = "packages/gateway"
run = "node --test --conditions=source test/integration.test.ts"

[tasks.eval]
description = "Replay policies/fixtures against a live engine; LOCAL_DECIDER_EVAL_URL=http://127.0.0.1:PORT of a `strands-decider serve` or gateway; exits 1 on a failed gate"
dir = "packages/gateway"
run = "node --conditions=source test/eval-live.ts"

[tasks."eval:record"]
description = "Like `eval`, and rewrite policies/fixtures/recorded/*.json; needs the pinned reference model (or --force)"
dir = "packages/gateway"
run = "node --conditions=source test/eval-live.ts --record"

[tasks."eval:compare"]
description = "Compare two `eval-live.ts --out` result sets: mise run eval:compare --before DIR --after DIR [--policy ID]"
dir = "packages/gateway"
run = "node --conditions=source test/eval-compare.ts"

[tasks."validate:mod"]
description = "Claude Code plugin: build the bundle and `claude plugin validate --strict`; skipped when claude is not on PATH, an error when CI=true (the e2e-install job pins claude via mise.e2e.toml)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if ! command -v claude >/dev/null 2>&1; then
  if [ "${CI:-}" = "true" ]; then
    echo "claude not on PATH in CI: install it (MISE_ENV=e2e, mise.e2e.toml)" >&2
    exit 1
  fi
  echo "claude not on PATH: skipping the plugin validation"
  exit 0
fi
pnpm --filter @ziptie-soft/local-decider-hooks build
claude plugin validate --strict plugins/local-decider
'''

[tasks."test:mod"]
description = "Claude Code mod: validate:mod, then its `claude plugin test`; skipped when claude is not on PATH, an error when CI=true"
depends = ["validate:mod"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
command -v claude >/dev/null 2>&1 || exit 0
cd plugins/local-decider
claude plugin test
'''

[tasks."e2e:claude"]
description = "Plugin end-to-end: headless Claude Code runs fixed steps in a scratch repo; checks the gateway's verdicts (needs a running gateway; LD_E2E_PLUGIN_DIR=plugins/local-decider tests the checkout)"
run = "node scripts/harness-e2e.mjs claude"

[tasks."e2e:claude-auto"]
description = "Plugin end-to-end: headless Claude Code in auto mode with one forced ask rule; checks PermissionRequest fires once and the mod reported claude-auto decisions (needs a running gateway)"
run = "node scripts/harness-e2e.mjs claude-auto"

[tasks."e2e:codex"]
description = "Plugin end-to-end: headless Codex runs fixed steps in a scratch repo; checks the gateway's verdicts (needs a running gateway and the plugin installed in Codex; with OPENAI_API_KEY set it installs the checkout into a temp CODEX_HOME instead)"
run = "node scripts/harness-e2e.mjs codex"

[tasks."e2e:install"]
description = "Secret-free plugin install e2e: installs the packed plugin into Claude Code and Codex under a temp HOME and checks the hooks reach a stub gateway; optional arg claude|codex|all"
run = [
  "pnpm --filter @ziptie-soft/local-decider-hooks build",
  "node scripts/harness-install-e2e.mjs",
]

[tasks."test:scripts"]
description = "Unit tests for the e2e helper scripts"
run = "node --test scripts/e2e-stub-gateway.test.mjs scripts/e2e-lib.test.mjs"

[tasks.e2e]
description = "Live plugin end-to-end for Claude Code and Codex (e2e:claude, e2e:claude-auto, then e2e:codex)"
run = "node scripts/harness-e2e.mjs all"

[tasks.gateway]
description = "Run the gateway in the foreground from source; args after --, e.g. mise run gateway -- --port 8765"
run = "node --conditions=source packages/gateway/src/cli.ts gateway run"

[tasks.sync-versions]
description = "Sync node/pnpm pins from mise.toml into package.json"
run = '''
#!/usr/bin/env bash
set -euo pipefail
PNPM_VERSION=$(mise current pnpm)
NODE_VERSION=$(mise current node)
cd "{{config_root}}"
node -e "
const fs = require('fs');
const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
pkg.packageManager = 'pnpm@' + '$PNPM_VERSION';
fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
"
echo "Synced: node=$NODE_VERSION pnpm=$PNPM_VERSION"
'''
