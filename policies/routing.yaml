# yaml-language-server: $schema=../schemas/policy.schema.json
# Routing: which model tier should a new agent or task get? `route:<preset>` names a preset the
# harness maps to a model in config.yaml (`routing.presets.<harness>`). This is the
# default; `routing-*.yaml` (and user policies with `variantOf: routing`) are selectable variants.
id: routing
version: 1
description: Pick a model tier for a new task from its prompt.
mode: shadow
priority: high
cache:
  ttlSeconds: 600
state:
  maxTokens: 1500
  sections:
    - { label: Project, from: project, keep: head }
    - { label: Task prompt, from: prompt, keep: ends }
questions:
  tier:
    type: choice
    instructions: >-
      Choose the smallest model tier that can reliably complete the coding task in the prompt.
    criteria:
      fast: A lookup, a one-line edit, a rename, formatting, or a question answerable from one file.
      standard: A bounded feature or bug fix touching a few files with clear requirements.
      deep: Architecture, multi-file refactors, subtle debugging, security work, or vague requirements.
rules:
  # Thresholds are minConfidence, c = (N*p - 1)/(N - 1) with N = 3 (2026-11-22, Q4): c 0.35 is
  # p 0.567, c 0.30 p 0.533, c 0.5 p 0.667. A tier needs a strict majority (p > 0.5); the downgrade
  # tier (fast) is never looser than the upgrade tier (deep). Standard's c 0.5 held off the wrong
  # argmax cases (p up to 0.584 + 0.05 margin). Was fast 0.7, deep 0.5.
  - when: { question: tier, answer: fast, minConfidence: 0.35 }
    action: route:fast
  - when: { question: tier, answer: deep, minConfidence: 0.30 }
    action: route:deep
  # Standard raised 0.5 -> 0.65 (p 0.767) after the Q4 holdout check (2026-11-22): h-r-deep-race
  # (expects deep) answered standard at p 0.715; 0.715 + 0.05 needs c >= 0.65. Tuning standard
  # cases score p 0.80-0.88 and still route.
  - when: { question: tier, answer: standard, minConfidence: 0.65 }
    action: route:standard
default: abstain
